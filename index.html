<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07090c" />
  <title>SOU CAVEIRA</title>
  <style>
    :root{
      --bg:#07090c;--panel:#11151b;--panel2:#171c24;--text:#f4f6f8;--muted:#9da7b4;--gold:#e5b83f;--ok:#42d17a;--bad:#ef6461;--line:#29323e;--shadow:0 18px 45px rgba(0,0,0,.28);
      --blue:#5ea3ff;--warning:#f7c96b;--danger:#ff7b7b;--soft:#1c2330;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:radial-gradient(circle at top,#111a25 0,#080b10 42%,#060709 100%);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    .app{max-width:980px;margin:0 auto;padding:16px 14px 40px}
    header{position:sticky;top:0;z-index:5;background:rgba(8,11,16,.8);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 0;gap:10px;max-width:980px;margin:0 auto}
    .brand{font-weight:900;letter-spacing:.08em;font-size:18px;color:var(--gold)}
    .brand small{display:block;letter-spacing:.12em;font-size:10px;color:var(--muted);margin-top:2px}
    .nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-ms-overflow-style:none;scrollbar-width:none}
    .nav::-webkit-scrollbar{display:none}
    .nav-btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:8px 12px;font-weight:700;font-size:12px;white-space:nowrap;cursor:pointer}
    .nav-btn.active{background:linear-gradient(135deg,#d9ad42,#f8d56f);color:#111;border-color:transparent}
    .section{background:rgba(17,21,27,.9);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-top:16px}
    .hero{padding:18px 0 6px}
    .eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--gold);margin:0 0 8px}
    h1,h2,h3,p{margin:0 0 10px}
    h1{font-size:28px;line-height:1.1}
    h2{font-size:22px}
    .muted{color:var(--muted)}
    .stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0 18px}
    .stat-card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px}
    .stat-card .label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
    .stat-card .value{font-size:24px;font-weight:800}
    .chip{display:inline-flex;align-items:center;background:#1d2732;border:1px solid var(--line);padding:5px 9px;border-radius:999px;color:var(--text);font-size:11px;font-weight:700;margin:0 6px 6px 0}
    .filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
    select,button,input{font:inherit}
    select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex:1 1 120px}
    .btn,.primary-btn,.secondary-btn,.ghost-btn{border:none;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;transition:.2s ease}
    .primary-btn{background:linear-gradient(135deg,#d9ad42,#f8d56f);color:#111}
    .secondary-btn{background:var(--blue);color:#091827}
    .ghost-btn{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .question-list{display:flex;flex-direction:column;gap:12px}
    .question-item{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:14px}
    .meta{display:flex;flex-wrap:wrap;align-items:center;margin-bottom:8px}
    .meta .chip{margin:0 8px 8px 0}
    .q-text{font-size:17px;line-height:1.5;margin:12px 0}
    .option-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
    .option{width:100%;text-align:left;background:#101821;border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text);cursor:pointer}
    .option.correct{background:rgba(66,209,122,.14);border-color:rgba(66,209,122,.7);color:var(--text)}
    .option.wrong{background:rgba(239,100,97,.12);border-color:rgba(239,100,97,.7);color:var(--text)}
    .option.selected{outline:2px solid var(--gold)}
    .data-panel{background:#101821;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
    .result-badge{display:inline-block;border-radius:999px;padding:6px 12px;font-weight:800;margin-bottom:10px}
    .result-badge.good{background:rgba(66,209,122,.14);color:var(--ok);border:1px solid rgba(66,209,122,.35)}
    .result-badge.bad{background:rgba(239,100,97,.12);color:var(--bad);border:1px solid rgba(239,100,97,.35)}
    .list-card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
    .row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .pill{padding:6px 10px;border-radius:999px;border:1px solid var(--line);font-size:11px;background:#111c28;color:var(--text);font-weight:700}
    .danger{color:var(--bad)}
    .success{color:var(--ok)}
    .warning{color:var(--warning)}
    .empty{background:var(--panel2);border:1px dashed var(--line);color:var(--muted);padding:18px;border-radius:14px;text-align:center}
    .summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .table{display:flex;flex-direction:column;gap:10px}
    .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
    .row:last-child{border-bottom:none}
    .small{font-size:12px;color:var(--muted)}
    .right{text-align:right}
    @media (max-width: 640px){
      .stats-grid,.summary-grid{grid-template-columns:1fr}
      .brand{font-size:16px}
      .app{padding:10px 10px 40px}
      .section{padding:14px}
      h1{font-size:24px}
    }
  </style>
</head>
<body>
  <div class="app">Carregando…</div>
  <script>
    const QUESTIONS = window.__QUESTIONS__ || [];
    const EDITAL = window.__EDITAL__ || {};
    const KEY = 'sou-caveira-v2';
    const LEGACY_KEY = 'sou-caveira-v1';

    function normalizeQuestion(q) {
      return {
        id: q.id || 'SEM-ID',
        subject: q.subject || 'Geral',
        topic: q.topic || q.assunto || 'Geral',
        subtopic: q.subtopic || q.subassunto || q.topic || 'Geral',
        difficulty: q.difficulty || 'média',
        question: q.question || q.text || 'Questão sem enunciado.',
        answer: q.answer || q.resposta || '',
        explanation: q.explanation || q.explicacao || q.justificativa || 'Sem explicação didática cadastrada para esta questão.',
        options: Array.isArray(q.options) ? q.options : (Array.isArray(q.alternatives) ? q.alternatives : (q.alternatives && typeof q.alternatives === 'object' ? Object.entries(q.alternatives).map(([k, v]) => `${k}: ${v}`) : [])),
        alternatives: q.alternatives && typeof q.alternatives === 'object' && !Array.isArray(q.alternatives) ? q.alternatives : null
      };
    }

    const QUESTION_POOL = QUESTIONS.map(normalizeQuestion);

    function defaultState() {
      return {
        view: 'home',
        subject: '',
        difficulty: '',
        topic: '',
        index: 0,
        answers: {},
        history: [],
        questionStats: {},
        errors: {},
        favorites: {},
        sim: null,
        reviewSession: null,
        focusQuestion: null,
        learned: {}
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(KEY);
        const legacy = localStorage.getItem(LEGACY_KEY);
        let parsed = raw ? JSON.parse(raw) : null;

        if (!parsed && legacy) {
          parsed = JSON.parse(legacy);
        }

        const base = defaultState();
        const merged = { ...base, ...(parsed || {}) };
        merged.answers = parsed && parsed.answers ? parsed.answers : {};
        merged.history = parsed && parsed.history ? parsed.history : [];
        merged.questionStats = parsed && parsed.questionStats ? parsed.questionStats : {};
        merged.errors = parsed && parsed.errors ? parsed.errors : {};
        merged.learned = parsed && parsed.learned ? parsed.learned : {};

        if ((!parsed || !merged.history.length) && legacy && legacy.answers) {
          Object.entries(legacy.answers).forEach(([id, item]) => {
            const q = getQuestion(id);
            if (!q) return;
            const wrong = item.correct === false ? 1 : 0;
            const correct = item.correct === true ? 1 : 0;
            const total = Math.max(1, wrong + correct);
            merged.questionStats[id] = {
              total,
              correct,
              wrong,
              lastResult: item.correct ? 'acertou' : 'errou',
              lastAnswerAt: item.at || new Date().toISOString(),
              selected: item.selected || '',
              correctAnswer: q.answer
            };
            if (wrong) {
              merged.errors[id] = {
                total,
                correct,
                wrong,
                learned: false,
                lastWrongAt: item.at || new Date().toISOString(),
                reviewed: false
              };
            }
          });
        }

        return merged;
      } catch (e) {
        return defaultState();
      }
    }

    let state = loadState();

    function save() {
      localStorage.setItem(KEY, JSON.stringify(state));
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function getQuestion(id) {
      return QUESTION_POOL.find((q) => q.id === id) || null;
    }

    function subjects() {
      return [...new Set(QUESTION_POOL.map((q) => q.subject))];
    }

    function filteredQuestions() {
      return QUESTION_POOL.filter((q) => {
        const subjectOK = !state.subject || q.subject === state.subject;
        const difficultyOK = !state.difficulty || q.difficulty === state.difficulty;
        const topicOK = !state.topic || q.topic === state.topic;
        return subjectOK && difficultyOK && topicOK;
      });
    }

    function getQuestionStat(id) {
      return state.questionStats[id] || { total: 0, correct: 0, wrong: 0, lastResult: null, lastAnswerAt: null, selected: '', correctAnswer: '' };
    }

    function buildQuestionOptions(q) {
      const raw = q.options && q.options.length ? q.options : [];
      if (raw.length) {
        return raw.map((text, index) => ({ label: String.fromCharCode(65 + index), text }));
      }
      if (q.alternatives && typeof q.alternatives === 'object') {
        return Object.entries(q.alternatives).map(([key, value]) => ({ label: String(key).toUpperCase(), text: value }));
      }
      return [];
    }

    function getSummaryStats() {
      const list = Object.values(state.questionStats);
      const answered = list.reduce((sum, item) => sum + (item.total || 0), 0);
      const correct = list.reduce((sum, item) => sum + (item.correct || 0), 0);
      const wrong = list.reduce((sum, item) => sum + (item.wrong || 0), 0);
      return { answered, correct, wrong, pct: answered ? Math.round((correct / answered) * 100) : 0 };
    }

    function getTopicMastery(subject) {
      const pool = QUESTION_POOL.filter((q) => q.subject === subject);
      const total = pool.reduce((sum, q) => sum + (getQuestionStat(q.id).total || 0), 0);
      const wrong = pool.reduce((sum, q) => sum + (getQuestionStat(q.id).wrong || 0), 0);
      if (!total) return { label: '—', color: 'muted', total, wrong, accuracy: 0 };
      const accuracy = (total - wrong) / total;
      if (accuracy >= 0.7) return { label: '🟢 bom domínio', color: 'success', total, wrong, accuracy };
      if (accuracy >= 0.45) return { label: '🟡 atenção', color: 'warning', total, wrong, accuracy };
      return { label: '🔴 baixo domínio', color: 'danger', total, wrong, accuracy };
    }

    function getSubjectBreakdown() {
      return subjects().map((subject) => {
        const pool = QUESTION_POOL.filter((q) => q.subject === subject);
        const total = pool.reduce((sum, q) => sum + (getQuestionStat(q.id).total || 0), 0);
        const wrong = pool.reduce((sum, q) => sum + (getQuestionStat(q.id).wrong || 0), 0);
        return { subject, total, wrong, accuracy: total ? (total - wrong) / total : 0 };
      });
    }

    function getErrorsForSubject(subject) {
      return QUESTION_POOL.filter((q) => q.subject === subject && (getQuestionStat(q.id).wrong || 0) > 0)
        .reduce((sum, q) => sum + (getQuestionStat(q.id).wrong || 0), 0);
    }

    function getTopicErrors() {
      const map = {};
      QUESTION_POOL.forEach((q) => {
        const stat = getQuestionStat(q.id);
        const wrong = stat.wrong || 0;
        if (wrong > 0) {
          const key = q.topic || q.subject;
          map[key] = (map[key] || 0) + wrong;
        }
      });
      return Object.entries(map).sort((a, b) => b[1] - a[1]).slice(0, 6);
    }

    function getMostMissedQuestions() {
      return QUESTION_POOL
        .filter((q) => (getQuestionStat(q.id).wrong || 0) > 0)
        .sort((a, b) => (getQuestionStat(b.id).wrong || 0) - (getQuestionStat(a.id).wrong || 0))
        .slice(0, 6)
        .map((q) => ({ q, stat: getQuestionStat(q.id) }));
    }

    function getPendingReviewCount() {
      return QUESTION_POOL.filter((q) => (getQuestionStat(q.id).wrong || 0) > 0 && !(state.learned[q.id] || state.errors[q.id]?.learned)).length;
    }

    function getReviewQueue() {
      return QUESTION_POOL.filter((q) => (getQuestionStat(q.id).wrong || 0) > 0 && !(state.learned[q.id] || state.errors[q.id]?.learned))
        .sort((a, b) => (getQuestionStat(b.id).wrong || 0) - (getQuestionStat(a.id).wrong || 0));
    }

    function openQuestion(id) {
      state.focusQuestion = id;
      state.view = 'questions';
      save();
      render();
    }

    function clearFocus() {
      state.focusQuestion = null;
      state.view = 'questions';
      save();
      render();
    }

    function recordAnswer(id, selectedLetter) {
      const q = getQuestion(id);
      if (!q) return;

      const normalizedSelected = String(selectedLetter || '').trim().toUpperCase();
      const normalizedCorrect = String(q.answer || '').trim().toUpperCase();
      const correct = normalizedSelected === normalizedCorrect;
      const now = new Date().toISOString();

      const prev = getQuestionStat(id);
      const next = {
        total: (prev.total || 0) + 1,
        correct: (prev.correct || 0) + (correct ? 1 : 0),
        wrong: (prev.wrong || 0) + (correct ? 0 : 1),
        lastResult: correct ? 'acertou' : 'errou',
        lastAnswerAt: now,
        selected: normalizedSelected,
        correctAnswer: normalizedCorrect
      };

      state.questionStats[id] = next;
      state.answers[id] = { selected: normalizedSelected, correct, at: now, ...next };

      state.history.push({
        id: q.id,
        disciplina: q.subject,
        assunto: q.topic,
        subassunto: q.subtopic || q.topic,
        dificuldade: q.difficulty,
        respostaEscolhida: normalizedSelected,
        respostaCorreta: normalizedCorrect,
        acertou: correct,
        dataHora: now,
        quantidadeVezesRespondida: next.total,
        quantidadeErros: next.wrong,
        quantidadeAcertos: next.correct
      });

      const errorRecord = state.errors[id] || { total: 0, correct: 0, wrong: 0, learned: false, lastWrongAt: null, reviewed: false };
      errorRecord.total = next.total;
      errorRecord.correct = next.correct;
      errorRecord.wrong = next.wrong;
      if (!correct) {
        errorRecord.lastWrongAt = now;
        errorRecord.reviewed = false;
      } else {
        errorRecord.lastCorrectAt = now;
      }
      state.errors[id] = errorRecord;

      if (correct && state.reviewSession && state.reviewSession.ids.includes(id)) {
        const done = state.reviewSession.ids.filter((qid) => qid !== id);
        state.reviewSession.ids = done;
        state.reviewSession.current = state.reviewSession.ids[0] || null;
      }

      if (correct && state.errors[id] && state.errors[id].wrong === 0) {
        state.errors[id].learned = true;
      }

      if (!correct) {
        state.errors[id].reviewed = false;
      }

      save();
      render();
    }

    function markQuestionLearned(id) {
      const q = getQuestion(id);
      if (!q) return;
      const errorRecord = state.errors[id] || { total: 0, correct: 0, wrong: 0, learned: false, reviewed: false };
      errorRecord.learned = true;
      errorRecord.reviewed = true;
      state.errors[id] = errorRecord;
      state.learned[id] = true;
      save();
      render();
    }

    function startReviewSession() {
      const queue = getReviewQueue();
      if (!queue.length) {
        alert('Nenhuma questão pendente de revisão no caderno de erros.');
        return;
      }
      state.reviewSession = {
        ids: queue.map((q) => q.id),
        index: 0,
        current: queue[0].id
      };
      state.view = 'questions';
      state.focusQuestion = queue[0].id;
      save();
      render();
    }

    function getReviewProgress() {
      if (!state.reviewSession || !state.reviewSession.ids.length) return { current: 0, total: 0 };
      return { current: state.reviewSession.index + 1, total: state.reviewSession.ids.length };
    }

    function navButtons() {
      const items = [
        ['home', 'Painel'],
        ['questions', 'Questões'],
        ['sim', 'Simulado'],
        ['review', 'Caderno de Erros'],
        ['syllabus', 'Edital'],
        ['laws', 'Lei Seca']
      ];
      return items.map(([key, label]) => `<button class="nav-btn ${state.view === key ? 'active' : ''}" data-nav="${key}">${label}</button>`).join('');
    }

    function shell(content) {
      return `<div class="app"><header><div class="topbar"><div class="brand">☠ SOU CAVEIRA<small>PMPE • AOCP • INDEPENDENTE</small></div><div class="nav">${navButtons()}</div></div></header><main>${content}</main></div>`;
    }

    function home() {
      const summary = getSummaryStats();
      const bySubject = getSubjectBreakdown();
      return `
        <section class="hero">
          <p class="eyebrow">Painel</p>
          <h1>Resumo do desempenho</h1>
          <p class="muted">Estatísticas calculadas a partir do histórico real das respostas registradas.</p>
        </section>
        <section class="stats-grid">
          <div class="stat-card"><span class="label">Questões respondidas</span><span class="value">${summary.answered}</span></div>
          <div class="stat-card"><span class="label">Acertos</span><span class="value">${summary.correct}</span></div>
          <div class="stat-card"><span class="label">Erros</span><span class="value">${summary.wrong}</span></div>
          <div class="stat-card"><span class="label">Aproveitamento</span><span class="value">${summary.pct}%</span></div>
        </section>
        <div class="section">
          <h2>Domínio por disciplina</h2>
          <div class="table">
            ${bySubject.map((item) => {
              const mastery = item.total ? (item.accuracy >= 0.7 ? '🟢 bom domínio' : item.accuracy >= 0.45 ? '🟡 atenção' : '🔴 baixo domínio') : '—';
              return `<div class="row"><div><strong>${esc(item.subject)}</strong><div class="small">${item.total} respostas • ${item.wrong} erros</div></div><div class="right"><span class="pill">${mastery}</span></div></div>`;
            }).join('') || '<div class="empty">Nenhuma resposta registrada ainda.</div>'}
          </div>
        </div>
      `;
    }

    function filters() {
      const topics = [...new Set(QUESTION_POOL.filter((q) => !state.subject || q.subject === state.subject).map((q) => q.topic))];
      return `
        <div class="filters">
          <select data-filter="subject">
            <option value="">Todas as disciplinas</option>
            ${subjects().map((subject) => `<option value="${esc(subject)}" ${state.subject === subject ? 'selected' : ''}>${esc(subject)}</option>`).join('')}
          </select>
          <select data-filter="difficulty">
            <option value="">Todas as dificuldades</option>
            ${['fácil','média','difícil'].map((level) => `<option value="${level}" ${state.difficulty === level ? 'selected' : ''}>${level}</option>`).join('')}
          </select>
          <select data-filter="topic">
            <option value="">Todos os assuntos</option>
            ${topics.map((topic) => `<option value="${esc(topic)}" ${state.topic === topic ? 'selected' : ''}>${esc(topic)}</option>`).join('')}
          </select>
        </div>
      `;
    }

    function questionCard(q) {
      const stat = getQuestionStat(q.id);
      const lastResult = state.answers[q.id];
      const options = buildQuestionOptions(q);
      const status = lastResult ? (lastResult.correct ? 'Acertou' : 'Errou') : 'Ainda não respondida';
      return `
        <article class="question-item">
          <div class="meta">
            <span class="chip">${esc(q.subject)}</span>
            <span class="chip">${esc(q.topic)}</span>
            <span class="chip">${esc(q.difficulty)}</span>
            ${stat.total ? `<span class="chip">${stat.total} tentativas</span>` : ''}
          </div>
          <div class="q-text">${esc(q.question)}</div>
          <div class="option-list">
            ${options.map(({ label, text }) => {
              const chosen = String(state.answers[q.id]?.selected || '').toUpperCase() === label.toUpperCase();
              const correct = String(q.answer || '').toUpperCase() === label.toUpperCase();
              const classes = ['option'];
              if (state.answers[q.id]) {
                if (correct) classes.push('correct');
                if (chosen && !correct) classes.push('wrong');
                if (chosen && correct) classes.push('selected');
              } else if (chosen) {
                classes.push('selected');
              }
              return `<button type="button" class="${classes.join(' ')}" data-answer-id="${q.id}" data-answer-key="${label}">${label}) ${esc(text)}</button>`;
            }).join('')}
          </div>
          ${lastResult ? `
            <div class="data-panel">
              <div class="result-badge ${lastResult.correct ? 'good' : 'bad'}">${status}</div>
              <p><strong>Resposta escolhida:</strong> ${esc(lastResult.selected || '-')}</p>
              <p><strong>Resposta correta:</strong> ${esc(q.answer || '-')}</p>
              ${q.explanation ? `<p><strong>Explicação:</strong> ${esc(q.explanation)}</p>` : ''}
              <p class="small">Tentativas: ${stat.total} • Acertos: ${stat.correct} • Erros: ${stat.wrong}</p>
            </div>
          ` : ''}
          <div class="btn-row">
            <button class="ghost-btn" data-open="${q.id}">Abrir questão</button>
            <button class="ghost-btn" data-toggle-learned="${q.id}">${state.learned[q.id] || state.errors[q.id]?.learned ? 'Aprendido' : 'Marcar como aprendido'}</button>
          </div>
        </article>
      `;
    }

    function questions() {
      if (state.focusQuestion) {
        const q = getQuestion(state.focusQuestion);
        if (!q) return `<section class="section"><h2>Questão não encontrada</h2><button class="primary-btn" data-action="clear-focus">Voltar</button></section>`;
        const progress = getReviewProgress();
        return `
          <section class="hero">
            <p class="eyebrow">Questão</p>
            <h1>${esc(q.subject)}</h1>
            ${state.reviewSession ? `<p class="muted">Revisão: ${progress.current}/${progress.total}</p>` : ''}
          </section>
          <section class="section">
            ${questionCard(q)}
            <div class="btn-row">
              <button class="primary-btn" data-action="clear-focus">Voltar ao banco</button>
              ${state.reviewSession ? `<button class="secondary-btn" data-action="next-review">Próxima questão</button>` : ''}
            </div>
          </section>
        `;
      }

      const list = filteredQuestions();
      return `
        <section class="hero">
          <p class="eyebrow">Banco de questões</p>
          <h1>Questões do SOU CAVEIRA</h1>
        </section>
        <section class="section">
          ${filters()}
          <div class="question-list">
            ${list.length ? list.map((q) => questionCard(q)).join('') : '<div class="empty">Nenhuma questão encontrada com esses filtros.</div>'}
          </div>
        </section>
      `;
    }

    function review() {
      const ids = QUESTION_POOL.filter((q) => (getQuestionStat(q.id).wrong || 0) > 0);
      const totalErrors = ids.length;
      const bySubject = subjects().map((subject) => ({ subject, total: getErrorsForSubject(subject) }));
      const byTopic = getTopicErrors();
      const missed = getMostMissedQuestions();
      const pending = getPendingReviewCount();

      return `
        <section class="hero">
          <p class="eyebrow">CADERNO DE ERROS</p>
          <h1>Resumo inteligente do aluno</h1>
          <p class="muted">Os indicadores abaixo são calculados com base no histórico real de respostas.</p>
        </section>
        <section class="stats-grid">
          <div class="stat-card"><span class="label">Total de questões erradas</span><span class="value">${totalErrors}</span></div>
          <div class="stat-card"><span class="label">Ainda não revisadas</span><span class="value">${pending}</span></div>
          <div class="stat-card"><span class="label">Erros por disciplina</span><span class="value">${bySubject.reduce((sum, item) => sum + item.total, 0)}</span></div>
          <div class="stat-card"><span class="label">Questões mais erradas</span><span class="value">${missed.length ? missed[0].q.id : '—'}</span></div>
        </section>
        <section class="section">
          <div class="btn-row">
            <button class="primary-btn" data-action="start-review">Revisar erros</button>
          </div>
          <div class="summary-grid">
            <div class="list-card">
              <h3>Erros por disciplina</h3>
              ${subjects().map((subject) => {
                const total = getErrorsForSubject(subject);
                return total ? `<div class="row"><span>${esc(subject)}</span><strong>${total}</strong></div>` : '';
              }).filter(Boolean).join('') || '<div class="empty">Sem erros por disciplina.</div>'}
            </div>
            <div class="list-card">
              <h3>Erros por assunto</h3>
              ${byTopic.length ? byTopic.map(([topic, total]) => `<div class="row"><span>${esc(topic)}</span><strong>${total}</strong></div>`).join('') : '<div class="empty">Sem erros por assunto.</div>'}
            </div>
          </div>
          <div class="list-card" style="margin-top:12px;">
            <h3>Questões que o aluno mais erra</h3>
            ${missed.length ? missed.map(({ q, stat }) => `<div class="row"><span>${esc(q.id)} • ${esc(q.subject)}</span><strong>${stat.wrong} erros</strong></div>`).join('') : '<div class="empty">Ainda não há dados suficientes.</div>'}
          </div>
          <div class="list-card" style="margin-top:12px;">
            <h3>Questões ainda não revisadas</h3>
            ${getReviewQueue().length ? getReviewQueue().slice(0, 8).map((q) => `<div class="row"><span>${esc(q.id)} • ${esc(q.subject)}</span><button class="ghost-btn" data-open="${q.id}">Abrir</button></div>`).join('') : '<div class="empty">Tudo revisado por enquanto.</div>'}
          </div>
        </section>
      `;
    }

    function syllabus() {
      return `
        <section class="hero">
          <p class="eyebrow">Planejamento</p>
          <h1>Edital verticalizado</h1>
          <p class="muted">Estrutura de estudo organizada por disciplina e tópico.</p>
        </section>
        <section class="section">
          ${subjects().map((subject) => `<div class="list-card"><h3>${esc(subject)}</h3>${[...new Set(QUESTION_POOL.filter((q) => q.subject === subject).map((q) => q.topic))].map((topic) => `<div class="row"><span>${esc(topic)}</span><span class="pill">${getTopicMastery(subject).label}</span></div>`).join('')}</div>`).join('')}
        </section>
      `;
    }

    function laws() {
      return `
        <section class="hero">
          <p class="eyebrow">Legislação</p>
          <h1>Lei Seca</h1>
          <p class="muted">Área de consulta e revisão institucional.</p>
        </section>
        <section class="section">
          ${(EDITAL && Array.isArray(EDITAL.leiSeca)) ? EDITAL.leiSeca.map((item) => `<div class="list-card"><h3>${esc(item.titulo || 'Item')}</h3><p>${esc(item.descricao || '')}</p></div>`).join('') : '<div class="empty">Nenhuma referência de lei seca cadastrada.</div>'}
        </section>
      `;
    }

    function sim() {
      if (!state.sim) {
        return `
          <section class="hero">
            <p class="eyebrow">Modo prova</p>
            <h1>Simulado PMPE</h1>
            <p class="muted">60 questões, cinco alternativas e resultado ao final.</p>
          </section>
          <section class="section">
            <button class="primary-btn" data-action="start-sim">Iniciar simulado</button>
          </section>
        `;
      }

      const current = state.sim.list[state.sim.i];
      if (!current) return `<section class="section"><h2>Simulado finalizado</h2><button class="primary-btn" data-action="finish-sim">Ver resultado</button></section>`;
      const options = buildQuestionOptions(current);
      const answered = state.sim.answers[current.id];
      return `
        <section class="hero">
          <p class="eyebrow">Simulado</p>
          <h1>Questão ${state.sim.i + 1}/${state.sim.list.length}</h1>
        </section>
        <section class="section">
          <div class="question-item">
            <div class="meta"><span class="chip">${esc(current.subject)}</span><span class="chip">${esc(current.topic)}</span><span class="chip">${esc(current.difficulty)}</span></div>
            <div class="q-text">${esc(current.question)}</div>
            <div class="option-list">
              ${options.map(({ label, text }) => {
                const selected = answered && answered.selected === label;
                return `<button class="option ${selected ? 'selected' : ''}" data-sim-answer="${label}" data-sim-id="${current.id}">${label}) ${esc(text)}</button>`;
              }).join('')}
            </div>
            <div class="btn-row">
              <button class="primary-btn" data-action="next-sim">Próxima</button>
            </div>
          </div>
        </section>
      `;
    }

    function render() {
      const viewMap = {
        home: home(),
        questions: questions(),
        sim: sim(),
        review: review(),
        syllabus: syllabus(),
        laws: laws()
      };
      document.body.innerHTML = shell(viewMap[state.view] || home());
    }

    document.addEventListener('click', (event) => {
      const nav = event.target.closest('[data-nav]');
      if (nav) {
        state.view = nav.dataset.nav;
        state.focusQuestion = null;
        if (state.view !== 'questions') state.subject = '';
        save();
        render();
        return;
      }

      const action = event.target.closest('[data-action]');
      if (action) {
        const { action: name } = action.dataset;
        if (name === 'clear-focus') {
          clearFocus();
        }
        if (name === 'start-review') {
          startReviewSession();
        }
        if (name === 'next-review') {
          const queue = getReviewQueue();
          const currentIndex = queue.findIndex((q) => q.id === state.focusQuestion);
          const next = queue[currentIndex + 1] || queue[0];
          if (next) {
            state.focusQuestion = next.id;
            state.reviewSession = { ids: queue.map((q) => q.id), index: queue.findIndex((q) => q.id === next.id), current: next.id };
            save();
            render();
          }
        }
        if (name === 'start-sim') {
          const pool = [...QUESTION_POOL].sort(() => Math.random() - 0.5);
          state.sim = { i: 0, list: pool.slice(0, 60), answers: {} };
          save();
          render();
        }
        if (name === 'next-sim') {
          const currentId = state.sim?.list[state.sim.i]?.id;
          if (currentId && state.sim.answers[currentId] === undefined) {
            alert('Responda a questão atual antes de avançar.');
            return;
          }
          if (state.sim && state.sim.i < state.sim.list.length - 1) {
            state.sim.i += 1;
            save();
            render();
          } else {
            state.sim = null;
            save();
            render();
          }
        }
        if (name === 'finish-sim') {
          state.sim = null;
          save();
          render();
        }
        return;
      }

      const openBtn = event.target.closest('[data-open]');
      if (openBtn) {
        openQuestion(openBtn.dataset.open);
        return;
      }

      const learned = event.target.closest('[data-toggle-learned]');
      if (learned) {
        markQuestionLearned(learned.dataset.toggleLearned);
        return;
      }

      const answerBtn = event.target.closest('[data-answer-id]');
      if (answerBtn) {
        const id = answerBtn.dataset.answerId;
        const key = answerBtn.dataset.answerKey;
        recordAnswer(id, key);
        return;
      }

      const simAnswer = event.target.closest('[data-sim-answer]');
      if (simAnswer) {
        const id = simAnswer.dataset.simId;
        const letter = simAnswer.dataset.simAnswer;
        if (!state.sim) return;
        state.sim.answers[id] = { selected: letter, at: Date.now() };
        state.answers[id] = { ...state.answers[id], selected: letter };
        save();
        render();
      }
    });

    document.addEventListener('change', (event) => {
      const filter = event.target.closest('[data-filter]');
      if (!filter) return;
      const key = filter.dataset.filter;
      if (key === 'subject') state.subject = filter.value;
      if (key === 'difficulty') state.difficulty = filter.value;
      if (key === 'topic') state.topic = filter.value;
      save();
      render();
    });

    render();
  </script>
</body>
</html>
