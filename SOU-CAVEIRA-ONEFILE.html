<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090c"><meta name="description" content="SOU CAVEIRA — preparação independente para PMPE Soldado"><title>SOU CAVEIRA — PMPE</title><style>
:root{--bg:#07090c;--panel:#11151b;--panel2:#171c24;--text:#f4f6f8;--muted:#9da7b4;--gold:#e5b83f;--ok:#42d17a;--bad:#ef6461;--line:#29323e;--shadow:0 18px 45px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at top,#111a25 0,#080b10 42%,#060709 100%);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select{font:inherit}button{cursor:pointer}.app{max-width:980px;margin:auto;min-height:100vh;padding:12px 12px 42px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px 12px}.brand{font-weight:950;letter-spacing:.09em;font-size:18px}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.16em;margin-top:2px}.top-actions{display:flex;gap:7px}.icon-btn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 11px}nav{display:flex;gap:6px;overflow:auto;padding:4px 0 10px;position:sticky;top:0;background:rgba(7,9,12,.94);backdrop-filter:blur(10px);z-index:20}nav button{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;white-space:nowrap}nav button.active{border-color:var(--gold);color:var(--gold)}main{padding-bottom:30px}.hero{background:linear-gradient(145deg,#151b24,#0e1218);border:1px solid var(--line);border-radius:18px;padding:20px;margin:8px 0 14px;box-shadow:var(--shadow)}.eyebrow{margin:0 0 7px;color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;color:var(--muted);line-height:1.55}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.primary,.ghost,.danger-btn{border-radius:11px;padding:12px 15px;font-weight:800}.primary{background:var(--gold);color:#101010;border:1px solid var(--gold)}.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.danger-btn{background:transparent;color:var(--bad);border:1px solid rgba(239,100,97,.35)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.card,.section,.question{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 8px 24px rgba(0,0,0,.12)}.card h3{margin:0 0 5px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.big{font-size:25px;font-weight:900}.ok{color:var(--ok)}.danger{color:var(--bad)}.section{margin-top:14px}.section h2{margin:0 0 11px;font-size:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05)}.row:last-child{border-bottom:0}.muted{color:var(--muted)}.progress{height:8px;background:#232a33;border-radius:20px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--gold);width:0}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.filter{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chip{display:inline-flex;background:#171d25;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:5px 8px;font-size:10px}.qtext{font-size:18px;line-height:1.55;font-weight:650;white-space:pre-wrap}.options{display:grid;gap:8px;margin-top:15px}.opt{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px;text-align:left;color:var(--text);line-height:1.45}.opt:disabled{cursor:default;opacity:1}.opt.correct{border-color:var(--ok);background:rgba(66,209,122,.12)}.opt.wrong{border-color:var(--bad);background:rgba(239,100,97,.12)}.explain{margin-top:13px;padding:13px;border-left:3px solid var(--gold);background:#171b20;border-radius:8px;line-height:1.55}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.notice{padding:12px;border:1px solid rgba(229,184,63,.25);background:rgba(229,184,63,.07);border-radius:12px;color:#ddd2ad;line-height:1.45}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}.statline{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.mini{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px}.mini span{display:block;color:var(--muted);font-size:11px}.mini b{font-size:20px}.hidden{display:none!important}.timer{font-variant-numeric:tabular-nums;font-weight:900}.result-score{text-align:center;padding:20px}.result-score strong{font-size:52px;display:block;color:var(--gold)}.result-score span{color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.modal-card{max-width:560px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.modal-card h2{margin-top:0}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr}.hero h1{font-size:23px}.qtext{font-size:16px}.app{padding:8px}.brand{font-size:16px}.statline{grid-template-columns:1fr 1fr 1fr}}
</style></head><body><div class="app">Carregando…</div><script>window.__QUESTIONS__=[{"id":"SC-00001","subject":"Língua Portuguesa","topic":"Interpretação de textos","difficulty":"difícil","type":"autoral","source":"SOU CAVEIRA","question":"Em um texto argumentativo, o autor afirma: “A rapidez de uma informação não elimina a necessidade de verificá-la; ao contrário, quanto maior a velocidade de circulação, maior deve ser o cuidado com sua confirmação.” A relação estabelecida entre as duas orações é de","options":["causa e consequência.","condição e finalidade.","concessão e conclusão.","proporção e reforço de uma recomendação.","explicação e oposição."],"answer":"D","explanation":"A segunda parte estabelece uma relação proporcional: à medida que aumenta a velocidade de circulação, aumenta a necessidade de cuidado. O segundo segmento reforça a recomendação anterior.","legal_basis":"","tags":["PMPE","AOCP-style","Língua Portuguesa","Interpretação de textos"]},{"id":"SC-00002","subject":"Língua Portuguesa","topic":"Figuras de linguagem","difficulty":"médio","type":"autoral","source":"SOU CAVEIRA","question":"Em “O silêncio da sala gritava mais que qualquer discurso”, predomina a figura de linguagem denominada","options":["metonímia.","personificação.","eufemismo.","antítese.","pleonasmo."],"answer":"B","explanation":"Atribui-se ao silêncio uma ação humana — gritar —, caracterizando personificação (prosopopeia).","legal_basis":"","tags":["PMPE","AOCP-style","Língua Portuguesa","Figuras de linguagem"]},{"id":"SC-00003","subject":"Língua Portuguesa","topic":"Crase","difficulty":"difícil","type":"autoral","source":"SOU CAVEIRA","question":"Assinale a alternativa em que o emprego do acento indicativo de crase está de acordo com a norma-padrão.","options":["O candidato dirigiu-se à uma sala reservada.","A equipe retornou à Recife após a prova.","A orientação foi entregue àqueles que solicitaram atendimento.","O fiscal começou à conferir os documentos.","A comissão ficou frente à frente com os candidatos."],"answer":"C","explanation":"“Àqueles” resulta da fusão da preposição a com o pronome demonstrativo aqueles. Nas demais, há problemas: não se usa crase antes de “uma”; Recife não admite artigo feminino nesse contexto; antes de verbo não há crase; em “frente a frente”, a locução não recebe crase.","legal_basis":"","tags":["PMPE","AOCP-style","Língua Portuguesa","Crase"]},{"id":"SC-00004","subject":"Língua Portuguesa","topic":"Concordância verbal","difficulty":"difícil","type":"autoral","source":"SOU CAVEIRA","question":"Assinale a frase correta segundo a norma-padrão.","options":["Houveram diversas ocorrências durante a operação.","Fazem dois anos que o candidato iniciou os estudos.","Devem existir soluções para o problema apresentado.","Existe, entre os documentos, informações divergentes.","Tratam-se de questões complexas."],"answer":"C","explanation":"O verbo existir concorda normalmente com o sujeito: “soluções”. Em “haver” impessoal, usa-se “houve”; “fazer” indicando tempo é impessoal; “informações” exigiria “existem”; “tratar-se” impessoal fica no singular.","legal_basis":"","tags":["PMPE","AOCP-style","Língua Portuguesa","Concordância verbal"]},{"id":"SC-00005","subject":"Língua Portuguesa","topic":"Regência verbal","difficulty":"difícil","type":"autoral","source":"SOU CAVEIRA","question":"Na norma-padrão, a construção que apresenta regência adequada é","options":["O candidato preferiu mais estudar do que descansar.","O servidor aspirava o cargo público.","A equipe informou o candidato do resultado.","O fiscal obedeceu o regulamento.","O candidato visou ao cargo pretendido."],"answer":"E","explanation":"No sentido de almejar, “visar” rege a preposição a: “visou ao cargo”. “Preferir” pede estrutura sem “mais”; “aspirar”, no sentido de desejar, rege a; “informar” pode admitir construções diferentes, mas a alternativa foi formulada para evitar a regência inadequada das demais; “obedecer” rege a.","legal_basis":"","tags":["PMPE","AOCP-style","Língua Portuguesa","Regência verbal"]},{"id":"SC-00006","subject":"Língua Portuguesa","topic":"Funções do que e do se","difficulty":"muito difícil","type":"autoral","source":"SOU CAVEIRA","question":"Em “É necessário que o candidato revise o conteúdo”, o termo “que” exerce a função de","options":["pronome relativo, retomando “candidato”.","conjunção integrante, introduzindo oração subordinada substantiva.","conjunção coordenativa explicativa.","pronome interrogativo.","partícula expletiva."],"answer":"B","explanation":"O “que” introduz uma oração que funciona como sujeito de “é necessário”, sem retomar antecedente nominal. Por isso é conjunção integrante.","legal_basis":"","tags":["PMPE","AOCP-style","Língua Portuguesa","Funções do que e do se"]},{"id":"SC-00007","subject":"Língua Portuguesa","topic":"Pontuação e coesão","difficulty":"difícil","type":"autoral","source":"SOU CAVEIRA","question":"Considere: “Os candidatos que estudaram com regularidade, porém, tiveram melhor desempenho.” A retirada das vírgulas que isolam “porém”","options":["obrigatoriamente altera o sentido temporal da oração.","é impossível, pois “porém” deve sempre ficar entre vírgulas.","pode ser admitida conforme sua posição e função, sem transformar “porém” em conjunção subordinativa.","transforma “porém” em advérbio de intensidade.","elimina a relação de contraste."],"answer":"C","explanation":"“Porém” é conjunção coordenativa adversativa e pode aparecer deslocada, sendo isolada por vírgulas quando intercalada. Sua retirada não elimina a relação adversativa, que pode ser expressa pela própria conjunção em outra posição.","legal_basis":"","tags":["PMPE","AOCP-style","Língua Portuguesa","Pontuação e coesão"]},{"id":"SC-00008","subject":"Língua Portuguesa","topic":"Acentuação","difficulty":"médio","type":"autoral","source":"SOU CAVEIRA","question":"Assinale a alternativa em que todas as palavras estão grafadas de acordo com a ortografia oficial vigente.","options":["ideia, herói, voo.","idéia, herói, vôo.","feiura, assembléia, herói.","enjôo, papéis, idéia.","vôo, jiboia, heróico."],"answer":"A","explanation":"Após o Acordo Ortográfico, “ideia” e “voo” perderam acento; “herói” mantém acento por ser oxítona com ditongo aberto tônico.","legal_basis":"","tags":["PMPE","AOCP-style","Língua Portuguesa","Acentuação"]},{"id":"SC-00009","subject":"Língua Portuguesa","topic":"Colocação pronominal","difficulty":"difícil","type":"autoral","source":"SOU CAVEIRA","question":"Assinale a alternativa em que a colocação pronominal está adequada à norma-padrão.","options":["Não diga-me isso agora.","Quando me avisarem, retornarei imediatamente.","Jamais entregarei-lhe o documento sem autorização.","Me disseram que a prova foi alterada.","Se encontrarei-o amanhã, entregarei o material."],"answer":"B","explanation":"A conjunção subordinativa “quando” atrai o pronome para antes do verbo: “Quando me avisarem”. As demais apresentam contextos de próclise ou construções inadequadas.","legal_basis":"","tags":["PMPE","AOCP-style","Língua Portuguesa","Colocação pronominal"]},{"id":"SC-00010","subject":"Língua Portuguesa","topic":"Variação linguística","difficulty":"médio","type":"autoral","source":"SOU CAVEIRA","question":"Sobre variação linguística, assinale a afirmação correta.","options":["Toda variedade não padrão é necessariamente errada em qualquer contexto.","A língua apresenta variações relacionadas, entre outros fatores, à região, ao grupo social e à situação comunicativa.","A norma-padrão elimina todas as variedades regionais.","Variação histórica ocorre somente na escrita literária.","Diferenças de registro não interferem na adequação comunicativa."],"answer":"B","explanation":"A língua varia conforme fatores geográficos, sociais, históricos e situacionais. Adequação depende do contexto comunicativo.","legal_basis":"","tags":["PMPE","AOCP-style","Língua Portuguesa","Variação linguística"]},{"id":"SC-00011","subject":"História de Pernambuco","topic":"Ocupação e colonização","difficulty":"médio","type":"autoral","source":"SOU CAVEIRA","question":"Na formação inicial da capitania de Pernambuco, Duarte Coelho destacou-se por","options":["administrar a capitania e impulsionar sua ocupação e atividade açucareira.","ser governador holandês de Pernambuco.","liderar a Revolução Pernambucana de 1817.","fundar a Confederação do Equador.","comandar a Revolução Praieira."],"answer":"A","explanation":"A alternativa correta corresponde ao processo histórico ou manifestação cultural descrita no enunciado.","legal_basis":"","tags":["PMPE","AOCP-style","História de Pernambuco","Ocupação e colonização"]},{"id":"SC-00012","subject":"História de Pernambuco","topic":"Economia açucareira","difficulty":"difícil","type":"autoral","source":"SOU CAVEIRA","question":"A expansão da produção açucareira em Pernambuco colonial esteve relacionada, principalmente, à","options":["produção voltada ao mercado atlântico, baseada no engenho e no trabalho escravizado.","industrialização urbana do século XVIII.","mineração de ouro em larga escala.","substituição completa do trabalho escravizado por assalariamento.","economia exclusivamente de subsistência."],"answer":"A","explanation":"A alternativa correta corresponde ao processo histórico ou manifestação cultural descrita no enunciado.","legal_basis":"","tags":["PMPE","AOCP-style","História de Pernambuco","Economia açucareira"]},{"id":"SC-00013","subject":"História de Pernambuco","topic":"Olinda e Recife","difficulty":"difícil","type":"autoral","source":"SOU CAVEIRA","question":"No processo histórico de formação de Olinda e Recife, é correto afirmar que","options":["a relação entre o núcleo urbano de Olinda e o porto do Recife foi central para a dinâmica econômica da capitania.","Recife surgiu como capital republicana no século XVII.","Olinda foi fundada pelos holandeses no século XVII.","Recife não possuía importância portuária no período colonial.","as duas cidades permaneceram economicamente isoladas."],"answer":"A","explanation":"A alternativa correta corresponde ao processo histórico ou manifestação cultural descrita no enunciado.","legal_basis":"","tags":["PMPE","AOCP-style","História de Pernambuco","Olinda e Recife"]},{"id":"SC-00014","subject":"História de Pernambuco","topic":"Domínio holandês","difficulty":"difícil","type":"autoral","source":"SOU CAVEIRA","question":"O governo de Maurício de Nassau em Pernambuco é associado a","options":["medidas administrativas, urbanísticas e culturais durante o domínio holandês, além da manutenção da economia açucareira.","fim imediato da produção de açúcar.","expulsão definitiva dos holandeses em 1637.","implantação da República de Pernambuco.","abolição da escravidão."],"answer":"A","explanation":"A alternativa correta corresponde ao processo histórico ou manifestação cultural descrita no enunciado.","legal_basis":"","tags":["PMPE","AOCP-style","História de Pernambuco","Domínio holandês"]},{"id":"SC-00015","subject":"História de Pernambuco","topic":"Insurreição Pernambucana","difficulty":"muito difícil","type":"autoral","source":"SOU CAVEIRA","question":"A Insurreição Pernambucana do século XVII esteve ligada","options":["à resistência luso-brasileira que culminou na expulsão dos holandeses de Pernambuco.","à independência do Brasil em 1822.","à Revolução Praieira de 1848.","à Confederação do Equador.","à Guerra dos Mascates."],"answer":"A","explanation":"A alternativa correta corresponde ao processo histórico ou manifestação cultural descrita no enunciado.","legal_basis":"","tags":["PMPE","AOCP-style","História de Pernambuco","Insurreição Pernambucana"]},{"id":"SC-00016","subject":"História de Pernambuco","topic":"Guerra dos Mascates","difficulty":"difícil","type":"autoral","source":"SOU CAVEIRA","question":"A Guerra dos Mascates relacionou-se, entre outros fatores, à","options":["disputa de poder e interesses entre a elite de Olinda e comerciantes de Recife.","luta entre holandeses e portugueses.","revolta contra a Independência do Brasil.","abolição do tráfico atlântico.","conflito entre Pernambuco e Ceará."],"answer":"A","explanation":"A alternativa correta corresponde ao processo histórico ou manifestação cultural descrita no enunciado.","legal_basis":"","tags":["PMPE","AOCP-style","História de Pernambuco","Guerra dos Mascates"]},{"id":"SC-00017","subject":"História de Pernambuco","topic":"Revolução 1817","difficulty":"muito difícil","type":"autoral","source":"SOU CAVEIRA","question":"A Revolução Pernambucana de 1817 caracterizou-se por","options":["movimento de caráter republicano e emancipacionista que rompeu temporariamente com o governo português.","defesa da restauração do domínio holandês.","movimento exclusivamente monarquista.","apoio à centralização do poder imperial.","movimento ocorrido após a Proclamação da República."],"answer":"A","explanation":"A alternativa correta corresponde ao processo histórico ou manifestação cultural descrita no enunciado.","legal_basis":"","tags":["PMPE","AOCP-style","História de Pernambuco","Revolução 1817"]},{"id":"SC-00018","subject":"História de Pernambuco","topic":"Confederação Equador","difficulty":"muito difícil","type":"autoral","source":"SOU CAVEIRA","question":"A Confederação do Equador, em 1824, esteve associada","options":["à oposição ao centralismo do Império e à defesa de maior autonomia, com forte participação pernambucana.","à restauração do domínio holandês.","à criação do Estado Novo.","à Independência de Pernambuco em 1817.","à Guerra dos Mascates."],"answer":"A","explanation":"A alternativa correta corresponde ao processo histórico ou manifestação cultural descrita no enunciado.","legal_basis":"","tags":["PMPE","AOCP-style","História de Pernambuco","Confederação Equador"]},{"id":"SC-00019","subject":"História de Pernambuco","topic":"Praieira","difficulty":"difícil","type":"autoral","source":"SOU CAVEIRA","question":"A Revolução Praieira (1848) ocorreu durante o período regencial e imperial?","options":["Não. Ocorreu no Segundo Reinado, em Pernambuco, em contexto de disputas políticas e sociais.","Sim, durante a Regência.","Sim, durante a Colônia.","Não. Ocorreu na Primeira República.","Não. Ocorreu durante o Estado Novo."],"answer":"A","explanation":"A alternativa correta corresponde ao processo histórico ou manifestação cultural descrita no enunciado.","legal_basis":"","tags":["PMPE","AOCP-style","História de Pernambuco","Praieira"]},{"id":"SC-00020","subject":"História de Pernambuco","topic":"Cultura pernambucana","difficulty":"médio","type":"autoral","source":"SOU CAVEIRA","question":"Entre manifestações culturais associadas a Pernambuco, encontram-se","options":["frevo e maracatu.","fandango gaúcho e carimbó.","baião exclusivamente cearense e jongo.","choro exclusivamente carioca e frevo.","bumba meu boi exclusivamente maranhense e frevo."],"answer":"A","explanation":"A alternativa correta corresponde ao processo histórico ou manifestação cultural descrita no enunciado.","legal_basis":"","tags":["PMPE","AOCP-style","História de Pernambuco","Cultura pernambucana"]},{"id":"SC-00021","subject":"Raciocínio Lógico","topic":"Proposições e conectivos","difficulty":"difícil","type":"autoral","source":"SOU CAVEIRA","question":"Se p é verdadeira e q é falsa, o valor lógico de p → q é","options":["Verdadeiro.","Falso.","Indeterminado.","Verdadeiro somente se p e q forem equivalentes.","Falso somente se p for falsa."],"answer":"B","explanation":"A resposta decorre diretamente da regra lógica ou combinatória indicada no enunciado.","legal_basis":"","tags":["PMPE","AOCP-style","Raciocínio Lógico","Proposições e conectivos"]},{"id":"SC-00022","subject":"Raciocínio Lógico","topic":"Negação","difficulty":"difícil","type":"autoral","source":"SOU CAVEIRA","question":"A negação lógica de “Todos os candidatos estudaram Direito Constitucional” é","options":["Nenhum candidato estudou Direito Constitucional.","Todos os candidatos não estudaram Direito Constitucional.","Pelo menos um candidato não estudo ção das palavras","Variação linguística"],"História de Pernambuco":["Ocupação e colonização – contatos iniciais, Capitanias Hereditárias e Duarte Coelho","Importância do açúcar para a economia local","Formação de Olinda e Recife","Presença holandesa e governo de Maurício de Nassau","Movimentos de resistência e emancipacionistas: Quilombos, Insurreição Pernambucana, Guerra dos Mascates, Revolução Pernambucana, Confederação do Equador, Guerra dos Cabanos e Revolução Praieira","Pernambuco e a República","Manifestações da cultura popular pernambucana – frevo, maracatu, culinária e festas populares","Herança afrodescendente em Pernambuco"],"Raciocínio Lógico":["Proposições e conectivos lógicos","Quantificadores e falácias","Analogias, inferências e deduções","Equivalência e implicação lógica","Argumentos válidos e conclusões","Diagramas lógicos","Princípios da contagem e técnicas de contagem","Princípio multiplicativo","Permutações, arranjos e combinações","Probabilidade"],"Informática":["Internet e intranet","Tecnologias, ferramentas, aplicativos e procedimentos associados à internet/intranet","Proteção e segurança","Armazenamento de dados e backup","Organização e gerenciamento de arquivos, pastas e programas","Instalação de periféricos","Windows em português – utilização básica","Microsoft Office 2019: Word, Excel e PowerPoint","LibreOffice 7: Writer, Calc e Impress"],"Direito Constitucional":["Princípios fundamentais","Direitos e garantias fundamentais","Direitos e deveres individuais e coletivos","Direito à vida, liberdade, igualdade, segurança e propriedade","Direitos sociais","Nacionalidade e direitos políticos","Remédios constitucionais","Organização político-administrativa e repartição de competências","União, Estados Federados e Municípios","Administração Pública e servidores públicos","Militares dos Estados, DF e Territórios","Poder Legislativo","Poder Executivo","Poder Judiciário","Defesa do Estado e das instituições democráticas","Súmulas, jurisprudência dominante e legislação relacionada"],"Direitos Humanos e Legislação Extravagante":["Teoria geral dos Direitos Humanos","Evolução histórica e gerações de direitos humanos","Incorporação de normas internacionais de Direitos Humanos ao direito interno brasileiro","Declaração Universal dos Direitos Humanos (ONU – 1948)","Crimes no Estatuto da Criança e do Adolescente","Lei nº 13.869/2019 – Abuso de Autoridade","Lei nº 9.455/1997 – Tortura","Lei nº 11.340/2006 – Maria da Penha","Lei nº 7.716/1989 – Crimes resultantes de preconceito de raça ou de cor","Lei nº 9.605/1998 – Crimes Ambientais","Lei nº 8.072/1990 – Crimes Hediondos","Lei nº 11.343/2006 – Lei de Drogas","Lei Estadual nº 6.783/1974 – Estatuto dos Policiais Militares de Pernambuco","Súmulas, jurisprudência dominante e legislação relacionada"]},"targets":{"Língua Portuguesa":900,"Direito Constitucional":900,"Direitos Humanos e Legislação Extravagante":900,"História de Pernambuco":600,"Raciocínio Lógico":600,"Informática":600}};</script><script>
const QUESTIONS=window.__QUESTIONS__, EDITAL=window.__EDITAL__;
const KEY='sou-caveira-v1';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{view:'home',subject:'',difficulty:'',topic:'',index:0,answers:{},errors:{},favorites:{},history:[],sim:null};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function stats(){const a=Object.values(state.answers),c=a.filter(x=>x.correct).length;return{answered:a.length,correct:c,wrong:a.length-c,pct:a.length?Math.round(c/a.length*100):0}}
function subjects(){return [...new Set(QUESTIONS.map(q=>q.subject))]}
function filtered(){return QUESTIONS.filter(q=>(!state.subject||q.subject===state.subject)&&(!state.difficulty||q.difficulty===state.difficulty)&&(!state.topic||q.topic===state.topic))}
function nav(){return `<nav>${[['home','Painel'],['questions','Questões'],['sim','Simulado'],['review','Erros'],['syllabus','Edital'],['laws','Lei Seca']].map(([k,l])=>`<button class="${state.view===k?'active':''}" data-nav="${k}">${l}</button>`).join('')}</nav>`}
function shell(body){return `<div class="app"><header><div class="brand">☠ SOU CAVEIRA<small>PMPE • AOCP • INDEPENDENTE</small></div><div class="top-actions"><button class="icon-btn" data-action="about">?</button></div></header>${nav()}<main>${body}</main></div>`}
function home(){const s=stats(), rows=subjects().map(sub=>{const a=Object.entries(state.answers).filter(([id])=>QUESTIONS.find(q=>q.id===id)?.subject===sub).map(([,v])=>v);const c=a.filter(v=>v.correct).length;return `<div class="row"><span>${esc(sub)}</span><b>${a.length?Math.round(c/a.length*100):0}% <span class="muted">(${a.length})</span></b></div>`}).join('');const targets=EDITAL.targets||{};return `<section class="hero"><p class="eyebrow">Missão PMPE</p><h1>Treine. Revise. Evolua.</h1><p>Plataforma independente de preparação para o Soldado PMPE. O banco atual contém <b>${QUESTIONS.length}</b> questões autorais; a meta de 5.000+ será atingida somente quando as questões existirem e forem validadas.</p><div class="actions"><button class="primary" data-action="mission">▶ Treino rápido</button><button class="ghost" data-nav="sim">Simulado de 60</button></div></section><div class="grid"><div class="card"><h3>Respondidas</h3><div class="big">${s.answered}</div></div><div class="card"><h3>Acertos</h3><div class="big ok">${s.correct}</div></div><div class="card"><h3>Erros</h3><div class="big danger">${s.wrong}</div></div><div class="card"><h3>Aproveitamento</h3><div class="big">${s.pct}%</div></div></div><section class="section"><div class="bar"><h2>Desempenho por disciplina</h2><span class="chip">${s.answered} respostas</span></div><div>${rows||'<div class="empty">Comece uma missão para montar seu mapa de desempenho.</div>'}</div></section><section class="section"><h2>Banco de questões</h2>${Object.entries(targets).map(([sub,target])=>{const n=QUESTIONS.filter(q=>q.subject===sub).length;return `<div class="row"><span>${esc(sub)}</span><span>${n} / ${target}</span></div>`}).join('')}</section>`}
function questions(){const list=filtered();if(!list.length)return `<section class="section"><h2>Banco de questões</h2>${filters()}<div class="empty">Nenhuma questão encontrada com esses filtros.</div></section>`;const i=Math.min(state.index,list.length-1),q=list[i],a=state.answers[q.id];return `<section class="section"><div class="bar"><h2>Banco de questões</h2><span class="chip">${i+1}/${list.length}</span></div>${filters()}${questionCard(q,a)}<div class="actions"><button class="ghost" data-action="prevq">Anterior</button><button class="primary" data-action="nextq">Próxima</button></div></section>`}
function filters(){const topics=[...new Set(QUESTIONS.filter(q=>!state.subject||q.subject===state.subject).map(q=>q.topic))];return `<div class="filters"><select class="filter" data-filter="subject"><option value="">Todas as disciplinas</option>${subjects().map(x=>`<option value="${esc(x)}" ${state.subject===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select class="filter" data-filter="topic"><option value="">Todos os assuntos</option>${topics.map(x=>`<option value="${esc(x)}" ${state.topic===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select class="filter" data-filter="difficulty"><option value="">Todas as dificuldades</option>${['fácil','médio','difícil','muito difícil'].map(x=>`<option value="${x}" ${state.difficulty===x?'selected':''}>${x}</option>`).join('')}</select></div>`}
function questionCard(q,a){const fav=!!state.favorites[q.id];return `<article class="question"><div class="meta"><span class="chip">${esc(q.subject)}</span><span class="chip">${esc(q.topic)}</span><span class="chip">${esc(q.difficulty)}</span><span class="chip">AUTORAL • AOCP-STYLE</span></div><div class="qtext">${esc(q.question)}</div><div class="options">${q.options.map((o,i)=>{const l='ABCDE'[i],cl=a?(l===q.answer?' correct':l===a.selected?' wrong':''):'';return `<button class="opt${cl}" data-answer="${q.id}|${l}" ${a?'disabled':''}><b>${l})</b> ${esc(o)}</button>`}).join('')}</div>${a?`<div class="explain"><b>${a.correct?'✓ Acertou':'✗ Errou'}</b><br>${esc(q.explanation)}${q.legal_basis?`<br><br><b>Fundamento:</b> ${esc(q.legal_basis)}`:''}</div>`:''}<div class="actions"><button class="ghost" data-action="fav" data-id="${q.id}">${fav?'★ Favorita':'☆ Favoritar'}</button></div></article>`}
function sim(){if(!state.sim)return `<section class="hero"><p class="eyebrow">Modo prova</p><h1>Simulado PMPE</h1><p>60 questões, cinco alternativas e resultado ao final. As questões são selecionadas do banco existente.</p><div class="notice">Banco atual: <b>${QUESTIONS.length}</b> questões. Não serão exibidas questões “fantasmas” para completar uma quantidade que não existe.</div><div class="actions"><button class="primary" data-action="startsim">Iniciar simulado</button></div></section>`;const s=state.sim,i=s.i,q=s.list[i],sel=s.answers[q.id];return `<section class="section"><div class="bar"><span>Questão ${i+1}/60</span><span class="timer" id="timer">${formatTime(s.endsAt-Date.now())}</span></div><div class="progress"><i style="width:${(i/60)*100}%"></i></div><article class="question" style="margin-top:12px">${questionCardSim(q,sel)}</article><div class="actions"><button class="ghost" data-action="simprev" ${i===0?'disabled':''}>Anterior</button><button class="primary" data-action="${i===59?'finishsim':'simnext'}">${i===59?'Finalizar':'Próxima'}</button></div></section>`}
function questionCardSim(q,sel){return `<div class="meta"><span class="chip">${esc(q.subject)}</span><span class="chip">Questão ${state.sim.i+1}/60</span></div><div class="qtext">${esc(q.question)}</div><div class="options">${q.options.map((o,i)=>`<button class="opt ${sel==='ABCDE'[i]?'correct':''}" data-sim="${q.id}|${'ABCDE'[i]}"><b>${'ABCDE'[i]})</b> ${esc(o)}</button>`).join('')}</div>`}
function review(){const ids=Object.keys(state.errors);return `<section class="hero"><p class="eyebrow">Revisão</p><h1>Caderno de erros</h1><p>Questões erradas: <b>${ids.length}</b>. Treine novamente e acompanhe sua evolução.</p></section><section class="section"><div class="list">${ids.map(id=>{const q=QUESTIONS.find(x=>x.id===id);return q?`<div class="row"><span><b>${esc(q.topic)}</b><br><span class="muted">${esc(q.subject)} • ${state.errors[id]} erro(s)</span></span><button class="ghost" data-review="${id}">Treinar</button></div>`:''}).join('')||'<div class="empty">Seu caderno ainda está vazio.</div>'}</div></section>`}
function syllabus(){return `<section class="hero"><p class="eyebrow">Planejamento</p><h1>Edital verticalizado</h1><p>Estrutura de estudo organizada por disciplina e tópico. O conteúdo oficial deve ser conferido no edital vigente.</p></section>${Object.entries(EDITAL.syllabus||{}).map(([s,items])=>`<section class="section"><h2>${esc(s)}</h2>${items.map(x=>`<div class="row"><span>□ ${esc(x)}</span><span class="muted">${QUESTIONS.filter(q=>q.subject===s&&q.topic===x).length} Q</span></div>`).join('')}</section>`).join('')}`}
function laws(){return `<section class="hero"><p class="eyebrow">Legislação</p><h1>Lei Seca</h1><p>Área de consulta e revisão. Nesta versão, a lista identifica os diplomas que deverão receber texto oficial versionado antes da publicação definitiva.</p></section><section class="section">${['Constituição Federal','Declaração Universal dos Direitos Humanos','ECA — Lei 8.069/1990','Abuso de Autoridade — Lei 13.869/2019','Tortura — Lei 9.455/1997','Maria da Penha — Lei 11.340/2006','Lei 7.716/1989','Crimes Ambientais — Lei 9.605/1998','Crimes Hediondos — Lei 8.072/1990','Lei de Drogas — Lei 11.343/2006','Estatuto dos Policiais Militares de PE — Lei Estadual 6.783/1974'].map(x=>`<div class="row"><span>${esc(x)}</span><span class="chip">PREPARAR</span></div>`).join('')}</section>`}
function render(){document.body.innerHTML=shell(state.view==='home'?home():state.view==='questions'?questions():state.view==='sim'?sim():state.view==='review'?review():state.view==='syllabus'?syllabus():laws());bind();if(state.sim)tick()}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.view=b.dataset.nav;state.index=0;save();render()});document.querySelectorAll('[data-filter]').forEach(s=>s.onchange=()=>{state[s.dataset.filter]=s.value;state.index=0;save();render()});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(...b.dataset.answer.split('|')));document.querySelectorAll('[data-sim]').forEach(b=>b.onclick=()=>{state.sim.answers[b.dataset.sim.split('|')[0]]=b.dataset.sim.split('|')[1];save();render()});document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{state.view='questions';const list=filtered(),i=list.findIndex(q=>q.id===b.dataset.review);state.index=Math.max(0,i);save();render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id))}
function answer(id,letter){const q=QUESTIONS.find(x=>x.id===id),correct=letter===q.answer;state.answers[id]={selected:letter,correct,at:Date.now()};if(!correct)state.errors[id]=(state.errors[id]||0)+1;save();render()}
function action(a,id){if(a==='mission'){state.view='questions';state.subject='';state.topic='';state.difficulty='';state.index=Math.floor(Math.random()*QUESTIONS.length);save();render()}else if(a==='nextq'){state.index++;save();render()}else if(a==='prevq'){state.index=Math.max(0,state.index-1);save();render()}else if(a==='fav'){state.favorites[id]=!state.favorites[id];save();render()}else if(a==='startsim'){startSim()}else if(a==='simnext'){state.sim.i++;save();render()}else if(a==='simprev'){state.sim.i--;save();render()}else if(a==='finishsim'){finishSim()}else if(a==='about'){alert('SOU CAVEIRA é um projeto independente. Não possui afiliação oficial com PMPE ou Instituto AOCP. Questões autorais são identificadas como AOCP-style.')}}
function startSim(){const pool=[...QUESTIONS].sort(()=>Math.random()-.5);let list=[];for(let i=0;i<60;i++)list.push(pool[i%pool.length]);state.sim={i:0,list,answers:{},endsAt:Date.now()+60*60*1000};save();render()}
function finishSim(){const s=state.sim;let correct=0,answered=0;for(const q of s.list){const l=s.answers[q.id];if(l){answered++;if(l===q.answer)correct++;if(l!==q.answer)state.errors[q.id]=(state.errors[q.id]||0)+1}}const pct=Math.round(correct/60*100);state.history.unshift({date:new Date().toISOString(),correct,answered,total:60,pct});state.history=state.history.slice(0,20);state.sim=null;save();state.view='home';render();setTimeout(()=>alert(`Simulado finalizado\n${correct}/60 acertos\n${pct}% de aproveitamento\nRespondidas: ${answered}/60`),50)}
function formatTime(ms){return Math.max(0,Math.floor(ms/1000)).toString().padStart(2,'0')==='00'?'00:00':`${String(Math.floor(ms/60000)).padStart(2,'0')}:${String(Math.floor(ms/1000)%60).padStart(2,'0')}`}
function tick(){if(!state.sim)return;const el=$('#timer');if(!el)return;if(Date.now()>=state.sim.endsAt){finishSim();return}el.textContent=formatTime(state.sim.endsAt-Date.now());setTimeout(tick,1000)}
render();
</script></body></html>
